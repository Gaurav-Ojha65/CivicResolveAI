# CivicResolve AI — Spring Boot Backend Configuration
# Phase 7: Spring Boot 4.1.1
#
# SECURITY: All secrets are supplied via environment variables.
# Never commit real passwords to source control.
# See backend/README.md for the secure PowerShell setup procedure.

# ─── SERVER ─────────────────────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/

# ─── APPLICATION DATASOURCE (civicresolve_app — restricted role) ────────────
# The application role can SELECT/INSERT/UPDATE but cannot create schema objects.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/civicresolve}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:civicresolve_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ─── JPA / HIBERNATE ────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# DDL is managed exclusively by Flyway — Hibernate must not touch the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.format_sql=false

# ─── FLYWAY (civicresolve_migrator — schema-change role) ────────────────────
# Flyway runs as the migrator role which owns DDL permissions.
# Never run migrations as civicresolve_app.
spring.flyway.enabled=true
spring.flyway.url=${SPRING_FLYWAY_URL:jdbc:postgresql://127.0.0.1:5432/civicresolve}
spring.flyway.user=${SPRING_FLYWAY_USER:civicresolve_migrator}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.table=flyway_schema_history

# ─── NLP SERVICE INTEGRATION ────────────────────────────────────────────────
civicresolve.nlp.service-url=${NLP_SERVICE_URL:http://127.0.0.1:8000}
# Timeouts in milliseconds
civicresolve.nlp.connect-timeout-ms=3000
civicresolve.nlp.read-timeout-ms=10000

# ─── PAGINATION DEFAULTS ────────────────────────────────────────────────────
civicresolve.pagination.default-page-size=20
civicresolve.pagination.max-page-size=100

# ─── SECURITY ───────────────────────────────────────────────────────────────
# Reviewers are configured in SecurityConfig. No hardcoded production passwords.
# BCrypt strength 12 for reviewer accounts.
civicresolve.security.bcrypt-strength=12

# ─── CORS ───────────────────────────────────────────────────────────────────
# Comma-separated list of allowed frontend origins for CORS.
# Defaults to Vite dev server (ports 3000, 3001, or 5173, localhost and 127.0.0.1) and Vite preview server (4173).
# Override in production: set CORS_ALLOWED_ORIGINS env-var or change this property.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}
civicresolve.cors.allowed-origins=${app.cors.allowed-origins}

# ─── LOGGING ────────────────────────────────────────────────────────────────
# Privacy-safe: never log narratives, credentials, or raw upstream bodies.
logging.level.ai.civicresolve=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO

# ─── ERROR HANDLING (RFC 9457 Problem Details) ──────────────────────────────
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
