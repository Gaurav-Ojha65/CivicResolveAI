# Integration test configuration — requires REAL PostgreSQL credentials
# This profile is activated for *IT.java tests via maven-failsafe-plugin.
# 
# REQUIRED environment variables before running integration tests:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:5432/civicresolve_test
#   SPRING_DATASOURCE_USERNAME=civicresolve_app
#   SPRING_DATASOURCE_PASSWORD=<app role password>
#   SPRING_FLYWAY_URL=jdbc:postgresql://127.0.0.1:5432/civicresolve_test
#   SPRING_FLYWAY_USER=civicresolve_migrator
#   SPRING_FLYWAY_PASSWORD=<migrator role password>

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/civicresolve_test}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:civicresolve_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.url=${SPRING_FLYWAY_URL:jdbc:postgresql://127.0.0.1:5432/civicresolve_test}
spring.flyway.user=${SPRING_FLYWAY_USER:civicresolve_migrator}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Explicitly override the H2Dialect set in the base test application.properties.
# spring.jpa.properties.hibernate.dialect (raw Hibernate property) takes precedence
# over spring.jpa.database-platform, so this must be set here to ensure PostgreSQLDialect
# is active when the 'it' profile is loaded against a live PostgreSQL database.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

civicresolve.nlp.service-url=http://127.0.0.1:8000
