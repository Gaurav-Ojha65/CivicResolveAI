# Test configuration — overrides application.properties for unit/slice tests
# NOTE: Real DB credentials are NOT used for unit tests.
# Integration tests that require a real DB use the IT profile (see application-it.properties).

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Disable Flyway for unit/slice tests — we use Hibernate DDL or manual setup
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Suppress JPA validation errors in tests
spring.jpa.hibernate.ddl-auto=create-drop

# NLP service URL for tests (will be mocked)
civicresolve.nlp.service-url=http://localhost:9999

# Security: use known test password
# REVIEWER_PASSWORD env var not needed for @WebMvcTest tests using @WithMockUser
