name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test -- --fileParallelism=false

      - name: Build production bundle
        run: npm run build

  backend:
    name: Backend and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: civicresolve_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d civicresolve_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/civicresolve_test
      SPRING_DATASOURCE_USERNAME: civicresolve_app
      SPRING_DATASOURCE_PASSWORD: app_password
      SPRING_FLYWAY_URL: jdbc:postgresql://127.0.0.1:5432/civicresolve_test
      SPRING_FLYWAY_USER: civicresolve_migrator
      SPRING_FLYWAY_PASSWORD: migrator_password
      REVIEWER_PASSWORD: ci_reviewer_password_not_for_production
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Create isolated database roles
        run: |
          psql -h 127.0.0.1 -U postgres -d civicresolve_test -v ON_ERROR_STOP=1 -c "CREATE ROLE civicresolve_migrator LOGIN PASSWORD 'migrator_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
          psql -h 127.0.0.1 -U postgres -d civicresolve_test -v ON_ERROR_STOP=1 -c "CREATE ROLE civicresolve_app LOGIN PASSWORD 'app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
          psql -h 127.0.0.1 -U postgres -d civicresolve_test -v ON_ERROR_STOP=1 -c "GRANT CONNECT ON DATABASE civicresolve_test TO civicresolve_migrator, civicresolve_app"
          psql -h 127.0.0.1 -U postgres -d civicresolve_test -v ON_ERROR_STOP=1 -c "ALTER SCHEMA public OWNER TO civicresolve_migrator"
          psql -h 127.0.0.1 -U postgres -d civicresolve_test -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA public TO civicresolve_app"

      - name: Run unit and PostgreSQL integration tests
        run: bash ./mvnw -B -ntp verify

  nlp:
    name: NLP service
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        working-directory: nlp-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nlp-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Run NLP tests
        run: python -m pytest tests -q -ra
