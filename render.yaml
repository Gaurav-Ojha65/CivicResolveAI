# Prepared API-only service. The NLP service is intentionally absent: the saved
# BiLSTM workflow exceeded Render Free's 512 MB memory limit in local measurement.
# Do not apply this Blueprint until a private, authenticated NLP endpoint exists.
services:
  - type: web
    name: civicresolve-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        value: civicresolve_app
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_FLYWAY_URL
        sync: false
      - key: SPRING_FLYWAY_USER
        value: civicresolve_migrator
      - key: SPRING_FLYWAY_PASSWORD
        sync: false
      - key: REVIEWER_PASSWORD
        sync: false
      - key: NLP_SERVICE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DB_POOL_MAX_SIZE
        value: "4"
      - key: DB_POOL_MIN_IDLE
        value: "1"
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx256m -XX:+UseSerialGC"
